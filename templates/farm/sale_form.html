{% extends 'base.html' %}
{% block content %}
<div class="card p-4 mt-4">
    <h2 class="mb-4">Add Sale for {{ crop.name }}</h2>

    <form method="post">
        {% csrf_token %}
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label">Sale Date</label>
                <input type="date" name="sale_date" class="form-control" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Buyer</label>
                <input type="text" name="buyer" class="form-control" placeholder="Buyer name">
            </div>
            <div class="col-md-6">
                <label class="form-label">Quantity Sold</label>
                <input type="number" step="0.01" name="quantity_sold" class="form-control" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Unit Price</label>
                <input type="number" step="0.01" name="unit_price" class="form-control" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Selling Cost</label>
                <input type="number" step="0.01" name="selling_cost" class="form-control" value="0">
            </div>
            <div class="col-md-6">
                <label class="form-label">Harvest (Optional)</label>
                <select name="harvest" class="form-select">
                    <option value="">-- Select harvest --</option>
                    {% for harvest in harvests %}
                        <option value="{{ harvest.pk }}">{{ harvest.harvest_date }} · {{ harvest.quantity }} {{ harvest.unit }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <button type="submit" class="btn btn-success mt-4">Save Sale</button>
    </form>
</div>
{% endblock %}
