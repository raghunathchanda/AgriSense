{% extends 'base.html' %}
{% load i18n %}

{% block content %}
<div class="card p-4 mt-4 mx-auto" style="max-width: 640px;">
    <h2 class="mb-3">{% trans "Delete Crop" %}</h2>
    <p class="mb-4">
        {% blocktrans with crop_name=crop.name %}Are you sure you want to delete "{{ crop_name }}"?{% endblocktrans %}
    </p>

    <form method="post">
        {% csrf_token %}
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-danger">{% trans "Delete" %}</button>
            <a href="{% url 'farm:crop_detail' crop.pk %}" class="btn btn-outline-secondary">{% trans "Cancel" %}</a>
        </div>
    </form>
</div>
{% endblock %}
